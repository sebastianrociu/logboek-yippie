<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Yippie-boekmerk. Transparante achtergrond, ruime en gelijke marge rond de
       vorm (geen kader, geen randje). Grof genoeg om op 16px leesbaar te blijven. -->
  <g transform="translate(256 256)" fill="#E8735A">
    <!-- Linker pagina -->
    <path d="M -150 -96 Q -147 -112 -132 -114 L -24 -122 Q -10 -122 -6 -108 L -6 108 Q -10 122 -24 120 L -132 112 Q -147 110 -150 94 Z"/>
    <!-- Rechter pagina -->
    <path d="M 150 -96 Q 147 -112 132 -114 L 24 -122 Q 10 -122 6 -108 L 6 108 Q 10 122 24 120 L 132 112 Q 147 110 150 94 Z"/>
    <!-- Boekrug -->
    <rect x="-8" y="-118" width="16" height="232" rx="3" fill="#C95A43"/>
    <!-- Tekstlijnen links -->
    <rect x="-124" y="-72" width="96" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="-124" y="-44" width="72" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="-124" y="-16" width="88" height="9" rx="4.5" fill="#FFFFFF"/>
    <!-- Tekstlijnen rechts -->
    <rect x="28" y="-72" width="96" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="28" y="-44" width="72" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="28" y="-16" width="88" height="9" rx="4.5" fill="#FFFFFF"/>
