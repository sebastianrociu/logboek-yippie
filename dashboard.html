<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--coral:#E8735A;--coral-dark:#C95A43;--coral-light:#FDECEA;--ink:#1A1A1A;--ink-2:#374151;
    --mute:#8A94A6;--line:#E6E9EF;--divider:#F1F3F7;--chev:#C3CAD5;--bg:#F2F2F7;--surface:#fff}
  html,body{background:var(--bg)}
  body{color:var(--ink);min-height:100%;-webkit-font-smoothing:antialiased;padding-bottom:64px}
  .wrap{max-width:600px;margin:0 auto}

  .hdr{position:relative;overflow:hidden;background:linear-gradient(135deg,#E8735A 0%,#EA7C63 45%,#F2A184 100%)}
  .hdr::before{content:"";position:absolute;right:-40px;top:-70px;width:210px;height:210px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.32),transparent 70%)}
  .hdr-in{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:14px 20px 30px;display:flex;align-items:center;gap:12px}
  .hdr-logo{width:30px;height:30px;flex-shrink:0}
  .hdr-txt{flex:1;min-width:0}
  .hdr-greet{font-size:11px;font-weight:600;color:rgba(255,255,255,.75)}
  .hdr-naam{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-datum{font-size:11px;font-weight:600;color:rgba(255,255,255,.65);margin-top:1px}
  .hdr-prof{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.35);
    color:#fff;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0;letter-spacing:-.5px}
  .hdr-wave{position:absolute;bottom:0;left:0;right:0;height:22px;background:var(--bg);border-radius:50% 50% 0 0/22px 22px 0 0}

  .section{padding:0 16px;margin-top:22px}
  .section-label{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;
    box-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.05)}

  .dienst{display:flex;gap:14px;padding:15px 16px;border-top:1px solid var(--divider)}
  .dienst:first-child{border-top:none}
  .dienst .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);margin-top:5px;flex-shrink:0}
  .dienst .body{flex:1;min-width:0}
  .dienst .les{font-size:15px;font-weight:800}
  .dienst .meta{font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}
  .dienst .in{align-self:center;flex-shrink:0;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);
    font-weight:700;font-size:12.5px;border-radius:10px;padding:7px 12px;cursor:pointer;font-family:inherit}
  .dienst .in:hover{border-color:#CBD2DC;background:#FAFBFC}
  .leeg{padding:15px 16px;font-size:13.5px;color:var(--mute);font-weight:600}

  .week-nav{display:flex;align-items:center;gap:4px}
  .week-nav button{background:none;border:none;cursor:pointer;color:var(--mute);font-size:18px;font-weight:700;padding:2px 6px;border-radius:8px;line-height:1}
  .week-nav button:hover{background:var(--divider);color:var(--ink)}
  .week-nav span{font-size:12px;font-weight:700;color:var(--ink);min-width:78px;text-align:center}
  .wrow{display:flex;gap:14px;padding:11px 16px;border-top:1px solid var(--divider)}
  .wrow:first-child{border-top:none}
  .wrow.vandaag{background:#FFF8F7}
  .wd{flex-shrink:0;width:40px;text-align:center}
  .wd .dn{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase}
  .wd .dd{font-size:20px;font-weight:900;line-height:1}
  .wrow.vandaag .wd .dd{color:var(--coral)}
  .ws{flex:1;font-size:13px;color:var(--ink-2);font-weight:600;align-self:center}
  .ws .vrij{color:#B9C0CC;font-style:italic;font-weight:500}
  .ws div + div{margin-top:2px}

  .qlink{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--divider);
    text-decoration:none;color:inherit;cursor:pointer}
  .qlink:first-child{border-top:none}
  .qlink:hover{background:#FAFBFC}
  .qlink .qb{flex:1}
  .qlink .qt{font-size:15px;font-weight:700;color:var(--ink)}
  .qlink .qs{font-size:12px;color:var(--mute);font-weight:500;margin-top:1px}
  .qlink .qc{color:var(--chev);font-size:18px;font-weight:700}
  .qlink.locked{cursor:default;opacity:.6}
  .qlink.locked:hover{background:none}
  .qlink.logboek .qt{color:var(--coral-dark)}

  .sheet-ov{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(4px);z-index:50;
    display:none;align-items:flex-end;justify-content:center}
  .sheet-ov.open{display:flex}
  .sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:600px;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0));
    box-shadow:0 -12px 40px rgba(15,23,42,.18);animation:up .25s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet .grip{width:40px;height:5px;background:#D8D8DD;border-radius:3px;margin:8px auto 14px}
  .sheet h3{font-size:17px;font-weight:900;margin-bottom:2px}
  .sheet p{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:16px}
  .sheet .row{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--divider);font-size:13.5px}
  .sheet .row b{font-weight:700}
  .sheet .uit{width:100%;margin-top:16px;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:14px;
    background:#1F2937;color:#fff;cursor:pointer;font-family:inherit}

  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-16px);background:#1A1A1A;color:#fff;
    font-size:13px;font-weight:600;padding:10px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  :focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-in">
    <svg class="hdr-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Yippie">
      <g transform="translate(256 226)" fill="#fff">
        <path d="M -120 -78 Q -118 -90 -106 -92 L -18 -98 Q -8 -98 -4 -88 L -4 78 Q -8 86 -18 84 L -106 78 Q -118 76 -120 64 Z"/>
        <path d="M 120 -78 Q 118 -90 106 -92 L 18 -98 Q 8 -98 4 -88 L 4 78 Q 8 86 18 84 L 106 78 Q 118 76 120 64 Z"/>
        <rect x="-6" y="-94" width="12" height="180" fill="rgba(0,0,0,.15)" rx="2"/>
      </g></svg>
    <div class="hdr-txt">
      <div class="hdr-greet" id="greet"></div>
      <div class="hdr-naam" id="naam"></div>
      <div class="hdr-datum" id="datum"></div>
    </div>
    <button class="hdr-prof" id="profBtn" title="Mijn profiel"></button>
  </div>
  <div class="hdr-wave"></div>
</div>

<div class="wrap">
  <div class="section">
    <div class="section-label">Vandaag</div>
    <div class="card" id="vandaagCard"></div>
  </div>

  <div class="section">
    <div class="section-label">Mijn week
      <span class="week-nav"><button id="wPrev" aria-label="Vorige week">&#8249;</button><span id="wLabel"></span><button id="wNext" aria-label="Volgende week">&#8250;</button></span>
    </div>
    <div class="card" id="weekCard"></div>
  </div>

  <div class="section">
    <div class="section-label">Meer</div>
    <div class="card" id="meerCard"></div>
  </div>
</div>

<div class="sheet-ov" id="profOv">
  <div class="sheet">
    <div class="grip"></div>
    <h3 id="pNaam"></h3>
    <p id="pRol"></p>
    <div class="row"><span>E-mail</span><b id="pMail"></b></div>
    <div class="row"><span>Logboek-toegang</span><b id="pToegang"></b></div>
    <button class="uit" id="uitBtn">Uitloggen</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="portaal-data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.YIPPIE_DEMO;

  var sessie = null;
  try { sessie = JSON.parse(localStorage.getItem("yippie_portaal_sessie") || "null"); } catch (e) {}
  if (!sessie) { location.replace("index.html"); return; }
  var toegang = false;
  try { toegang = localStorage.getItem("yippie_logboek_toegang") === "1"; } catch (e) {}

  var DAGEN = ["ma", "di", "wo", "do", "vr", "za", "zo"];
  var DAGEN_LANG = ["maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag", "zondag"];
  var MAAND = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
  var rooster = (sessie.key && D.rooster[sessie.key]) || [];

  function initialen(n) {
    var p = (n || "").trim().split(/\s+/).filter(Boolean);
    return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function nlWeekdag(d) { return (d.getDay() + 6) % 7; } // 0 = maandag
  function maandagVan(d) { var x = new Date(d); x.setDate(x.getDate() - nlWeekdag(x)); x.setHours(0, 0, 0, 0); return x; }

  var toastT;
  function toast(m) {
    var el = document.getElementById("toast"); el.textContent = m; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  // ---------- Header ----------
  var now = new Date();
  var u = now.getHours();
  document.getElementById("greet").textContent = u < 12 ? "Goedemorgen" : (u < 18 ? "Goedemiddag" : "Goedenavond");
  document.getElementById("naam").textContent = sessie.naam;
  document.getElementById("datum").textContent = DAGEN_LANG[nlWeekdag(now)].replace(/^./, function (c) { return c.toUpperCase(); }) + " " + now.getDate() + " " + MAAND[now.getMonth()];
  document.getElementById("profBtn").textContent = initialen(sessie.naam);

  // ---------- Vandaag ----------
  var vd = nlWeekdag(now);
  var vandaag = rooster.filter(function (r) { return r.dag === vd; });
  var vc = document.getElementById("vandaagCard");
  if (!vandaag.length) {
    vc.innerHTML = '<div class="leeg">Vandaag geen dienst ingepland.</div>';
  } else {
    vc.innerHTML = vandaag.map(function (r) {
      return '<div class="dienst"><span class="dot"></span><div class="body">' +
        '<div class="les">' + esc(r.les) + '</div>' +
        '<div class="meta">' + r.van + '-' + r.tot + ' &nbsp;&middot;&nbsp; ' + esc(r.plaats) + '</div>' +
        '</div><button class="in" data-in="1">Inchecken</button></div>';
    }).join("");
    vc.querySelectorAll("[data-in]").forEach(function (b) {
      b.addEventListener("click", function () { b.textContent = "Ingecheckt"; b.disabled = true; toast("Ingecheckt (demo)"); });
    });
  }

  // ---------- Mijn week ----------
  var weekOffset = 0;
  function renderWeek() {
    var ma = maandagVan(now); ma.setDate(ma.getDate() + weekOffset * 7);
    var eind = new Date(ma); eind.setDate(eind.getDate() + 6);
    document.getElementById("wLabel").textContent = weekOffset === 0 ? "deze week" :
      (ma.getDate() + " " + MAAND[ma.getMonth()].slice(0, 3) + " - " + eind.getDate() + " " + MAAND[eind.getMonth()].slice(0, 3));
    var html = "";
    for (var i = 0; i < 7; i++) {
      var dag = new Date(ma); dag.setDate(dag.getDate() + i);
      var isVandaag = weekOffset === 0 && i === vd;
      var diensten = rooster.filter(function (r) { return r.dag === i; });
      html += '<div class="wrow' + (isVandaag ? " vandaag" : "") + '">' +
        '<div class="wd"><div class="dn">' + DAGEN[i] + '</div><div class="dd">' + dag.getDate() + '</div></div>' +
        '<div class="ws">' + (diensten.length
          ? diensten.map(function (r) { return "<div>" + r.van + " " + esc(r.les) + "</div>"; }).join("")
          : '<span class="vrij">vrij</span>') + '</div></div>';
    }
    document.getElementById("weekCard").innerHTML = html;
  }
  document.getElementById("wPrev").addEventListener("click", function () { weekOffset--; renderWeek(); });
  document.getElementById("wNext").addEventListener("click", function () { weekOffset++; renderWeek(); });
  renderWeek();

  // ---------- Meer ----------
  var logboekTile = toegang
    ? '<a class="qlink logboek" href="logboek.html"><div class="qb"><div class="qt">Logboek Wiskundeschool</div>' +
      '<div class="qs">Noteer wat je met leerlingen hebt gedaan</div></div><span class="qc">&#8250;</span></a>'
    : '<div class="qlink locked"><div class="qb"><div class="qt">Logboek</div>' +
      '<div class="qs">Beschikbaar zodra je op Wiskundeschool bent ingepland</div></div><span class="qc">&#128274;</span></div>';

  document.getElementById("meerCard").innerHTML =
    logboekTile +
    '<div class="qlink" data-soon="1"><div class="qb"><div class="qt">Beschikbaarheid doorgeven</div>' +
      '<div class="qs">Wanneer kun je werken?</div></div><span class="qc">&#8250;</span></div>' +
    '<div class="qlink" id="meerProf"><div class="qb"><div class="qt">Mijn profiel</div>' +
      '<div class="qs">Naam bekijken &middot; uitloggen</div></div><span class="qc">&#8250;</span></div>';
  document.querySelectorAll("[data-soon]").forEach(function (el) {
    el.addEventListener("click", function () { toast("Nog niet in de demo"); });
  });
  document.getElementById("meerProf").addEventListener("click", openProf);

  // ---------- Profiel ----------
  function openProf() {
    document.getElementById("pNaam").textContent = sessie.naam;
    document.getElementById("pRol").textContent = sessie.rol === "mentor" ? "Mentor" : "Yippie";
    document.getElementById("pMail").textContent = sessie.email || "-";
    document.getElementById("pToegang").textContent = toegang ? "Ja" : "Nog niet";
    document.getElementById("profOv").classList.add("open");
  }
  document.getElementById("profBtn").addEventListener("click", openProf);
  document.getElementById("profOv").addEventListener("click", function (e) {
    if (e.target === this) this.classList.remove("open");
  });
  document.getElementById("uitBtn").addEventListener("click", function () {
    try {
      localStorage.removeItem("yippie_portaal_sessie");
      localStorage.removeItem("yippie_logboek_toegang");
    } catch (e) {}
    location.href = "index.html";
  });
})();
</script>
</body>
</html>
