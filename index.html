<style>
  *{box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;padding:0}
  :root{--coral:#E8735A;--coral-dark:#C95A43;--coral-light:#FDECEA;--ink:#1A1A1A;--mute:#6B7280;--line:#E6E9EF}
  body{min-height:100vh;background:linear-gradient(135deg,#FFF5F3 0%,#F7F7F7 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink);-webkit-font-smoothing:antialiased}
  .card{background:#fff;border-radius:24px;box-shadow:0 1px 3px rgba(15,23,42,.05),0 8px 40px rgba(232,115,90,.12);
    padding:40px 34px 30px;width:100%;max-width:410px}
  .brand{text-align:center;margin-bottom:26px}
  .brand .mark{width:56px;height:56px;border-radius:16px;background:var(--coral);display:grid;place-items:center;margin:0 auto 14px}
  .brand .mark svg{width:34px;height:34px}
  .brand h1{font-size:22px;font-weight:900;letter-spacing:-.02em}
  .brand p{font-size:13px;color:var(--mute);margin-top:3px}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#8A94A6;margin-bottom:5px}
  .fi{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;background:#fff;
    transition:border-color .13s,box-shadow .13s}
  .fi:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-light)}
  .field + .field{margin-top:13px}
  .btn{width:100%;min-height:44px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;
    background:var(--coral);color:#fff;box-shadow:0 2px 8px rgba(232,115,90,.28);margin-top:16px;transition:background .13s}
  .btn:hover{background:var(--coral-dark)}
  .hint{font-size:12px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.5}
  .sep{display:flex;align-items:center;gap:10px;margin:22px 0 14px;color:#9CA3AF;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
  .demo{display:flex;flex-direction:column;gap:8px}
  .demo button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
    border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;cursor:pointer;font-family:inherit;transition:border-color .13s,background .13s}
  .demo button:hover{border-color:#CBD2DC;background:#FAFBFC}
  .demo .t{font-size:13.5px;font-weight:700;color:var(--ink);display:block}
  .demo .s{font-size:11.5px;color:var(--mute);display:block;margin-top:1px}
  .demo .chev{color:#C3CAD5;font-size:16px;font-weight:700;flex-shrink:0}
  .foot{margin-top:20px;padding-top:16px;border-top:1px solid #F1F3F7;font-size:11px;color:#9CA3AF;text-align:center;line-height:1.5}
  :focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="translate(256 226)" fill="#fff">
        <path d="M -120 -78 Q -118 -90 -106 -92 L -18 -98 Q -8 -98 -4 -88 L -4 78 Q -8 86 -18 84 L -106 78 Q -118 76 -120 64 Z"/>
        <path d="M 120 -78 Q 118 -90 106 -92 L 18 -98 Q 8 -98 4 -88 L 4 78 Q 8 86 18 84 L 106 78 Q 118 76 120 64 Z"/>
        <rect x="-6" y="-94" width="12" height="180" fill="#C95A43" rx="2"/>
      </g></svg></div>
    <h1>Mijn Yippie</h1>
    <p>Inloggen op jouw persoonlijke portaal</p>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="email">E-mailadres</label>
      <input class="fi" type="email" id="email" placeholder="naam@yippievoordeklas.nl" autocomplete="email" required autofocus>
    </div>
    <div class="field">
      <label for="pw">Wachtwoord</label>
      <input class="fi" type="password" id="pw" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Inloggen &#8594;</button>
    <p class="hint">Demo: elk e-mailadres en wachtwoord werkt.</p>
  </form>

  <div class="sep">of kies een demo-account</div>
  <div class="demo" id="demo"></div>

  <p class="foot">Demo-omgeving. Geen echte gegevens. Het logboek verschijnt pas
     zodra je account op Wiskundeschool staat ingepland.</p>
</div>

<script src="portaal-data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.YIPPIE_DEMO;

  // Al ingelogd? Door naar het dashboard.
  try {
    if (localStorage.getItem("yippie_portaal_sessie")) { location.replace("dashboard.html"); return; }
  } catch (e) {}

  function heeftWiskundeschool(key) {
    var r = (D.rooster[key] || []);
    return r.some(function (d) { return d.les === D.LES_MET_LOGBOEK; });
  }

  function login(sessie) {
    try {
      localStorage.setItem("yippie_portaal_sessie", JSON.stringify(sessie));
      var ws = sessie.key ? heeftWiskundeschool(sessie.key) : !!sessie.wiskundeschool;
      if (ws) localStorage.setItem("yippie_logboek_toegang", "1");
    } catch (e) {}
    location.href = "dashboard.html";
  }

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var naam = email.split("@")[0].replace(/[._-]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }) || "Yippie";
    login({ key: null, naam: naam, email: email, rol: "yippie", wiskundeschool: false });
  });

  var demoBox = document.getElementById("demo");
  [
    { acc: D.accounts.sanne,  sub: "Yippie · staat op Wiskundeschool" },
    { acc: D.accounts.noor,   sub: "Yippie · nog niet op Wiskundeschool" },
    { acc: D.accounts.mentor, sub: "Mentor · alleen-lezen logboek" }
  ].forEach(function (row) {
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span><span class="t">' + row.acc.naam + '</span><span class="s">' + row.sub + '</span></span><span class="chev">&#8250;</span>';
    b.addEventListener("click", function () { login(Object.assign({}, row.acc)); });
    demoBox.appendChild(b);
  });
})();
</script>
</body>
</html>
